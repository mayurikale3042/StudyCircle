
name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: xcode-27

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Build and run tests
        run: xcodebuild test -project Study_Circle/Study_Circle.xcodeproj -scheme Study_Circle -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' CODE_SIGNING_ALLOWED=NO
